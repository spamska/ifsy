name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable

    - name: Install C toolchain
      run: sudo apt update && sudo apt install -y clang lld xorriso mtools gdisk

    - name: Build kernel
      run: make
